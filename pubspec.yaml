name: fausto
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shimmer: ^3.0.0
  dio: ^5.9.0
  go_router: ^16.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/Imagens/
    - assets/Imagens/alfabeto/
    - assets/Imagens/animais/
    - assets/Imagens/frutas/
    - assets/Imagens/numeros/
    - assets/Imagens/dias_da_semana/
    - assets/Imagens/leitura/
    - assets/Imagens/cores/
    - assets/Imagens/desenho/
    - assets/Imagens/jogo_quiz/
    - assets/audios/alfabeto/
    - assets/audios/numeros/
    - assets/audios/animais/
    - assets/audios/frutas/
    - assets/audios/dias_da_semana/
    - assets/audios/cores/
    - assets/audios/respostas/
    - assets/Imagens/fundos/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
